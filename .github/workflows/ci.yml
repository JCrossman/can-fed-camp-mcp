name: CI

# Gate every PR to main (and pushes to main) on a clean build + the offline test
# suite. Tests never touch live public services — recorded fixtures only — so CI is
# deterministic and never hammers an upstream (Constitution Art. 7.3).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm first, so setup-node's pnpm cache has a package manager to key on.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Defense-in-depth: fail fast if obvious PII (real-looking email/phone/SIN)
      # slipped into a tracked file. Honestly partial — pairs with secret scanning
      # (credentials) and review (everything else). Needs only node + git.
      - name: PII tripwire
        run: node scripts/check-pii.mjs

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc — also typechecks)
        run: pnpm -r build

      - name: Test (offline, fixture-backed)
        run: pnpm -r test

      - name: Audit packaged bundle
        run: |
          node packages/bundle/scripts/build-mcpb.mjs
          pnpm audit:bundle
          pnpm smoke:bundle
          pnpm exec mcpb pack packages/bundle/.mcpb-build packages/bundle/open-state-camping.mcpb
          node scripts/normalize-mcpb.mjs packages/bundle/open-state-camping.mcpb
          pnpm audit:mcpb
          pnpm smoke:npm
          pnpm check:reproducible
